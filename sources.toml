# Официальные источники требований площадок.
#
# У площадки либо `list` — файл со списком страниц (llms.txt), из которого
# берутся адреса, подходящие под `include`, — либо явный список `pages`, либо
# оба. `.md` берётся как есть, остальное — HTML, из которого вырезается
# основной текст. `every` — как часто сервер сверяет площадку.
#
# Сюда не входят: Newgrounds (403 на любой скрипт), Facebook Instant Games
# (robots.txt запрещает автоматический сбор без разрешения Meta), Kongregate и
# Armor Games (публичных требований нет).

[platforms.yandex]
title = "Яндекс Игры"
tier = 1
every = "day"
list = "https://yandex.ru/dev/games/doc/ru/llms.txt"
include = [
  "/requirements/",
  "/concepts/(requirements|moderation|performance|quick-start|start-screen|languages-and-domains|troubleshooting|ranking-and-featuring)\\.md$",
  "/sdk/sdk-(about|game-events|adv|purchases|player|environment|params|review|shortcut|other-games)\\.md$",
  "/services/about-monetization\\.md$",
]

