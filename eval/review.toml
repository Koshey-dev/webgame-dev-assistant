# Кейс — правка настоящего файла проекта (old → new, old встречается ровно раз).
# bug: ошибка найдена, если в багах или архитектуре есть замечание на `file`
#      с одним из `keys`; clean: правка верная — багов быть не должно.
# Код поменялся и old не находится — кейс устарел, скрипт скажет об этом.

