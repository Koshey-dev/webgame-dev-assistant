# Контрольный набор: 20 вопросов по базе, 5 разговорных, 3 вне базы.
#
# keys — группы ключевых строк: в ответе должна найтись хотя бы одна строка
# из КАЖДОЙ группы (без учёта регистра, пробелов внутри чисел и вида тире).
# Сверка по строкам, а не по смыслу: верный ответ другими словами она не
# засчитает — поэтому ключи короткие, числа и имена методов.
# kind: base — по базе, talk — разговорная форма, outside — ответа в базе нет,
# ждём «в базе нет» (код ниже порога или отказ модели).

